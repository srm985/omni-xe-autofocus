name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m pytest -q

  exe:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[build]"
      - run: choco install innosetup --no-progress -y
      - run: powershell -ExecutionPolicy Bypass -File tools/build_exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: omni-autofocus-windows
          path: |
            dist/OmniAutofocus-Setup.exe
            dist/OmniAutofocus.exe
            dist/omni-autofocus.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/release_notes.py ${{ github.ref_name }} ${{ github.repository }} release-notes.md
      # Only the installer: it contains both programs, so users have one file to pick.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OmniAutofocus-Setup.exe
          body_path: release-notes.md
