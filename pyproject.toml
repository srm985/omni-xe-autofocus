[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-autofocus"
version = "1.0.0"
description = "Standalone autofocus helper for the ComMarker Omni Xe (BSL controller) so it can be used alongside LightBurn"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = ["Operating System :: Microsoft :: Windows"]
dependencies = []  # runtime uses only the standard library (ctypes)

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6"]  # standalone .exe, see tools/build_exe.ps1

[project.scripts]
omni-autofocus = "omni_autofocus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
